{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
  {{- $annotations := .Values.ingress.annotations | default dict }}
  {{- if .Values.basicAuth.enabled }}
  {{- $middlewareName := printf "%s-%s-basic-auth@kubernetescrd" .Release.Namespace (include "backend.fullname" .) }}
  {{- $existing := index $annotations "traefik.ingress.kubernetes.io/router.middlewares" | default "" }}
  {{- if $existing }}
  {{- $annotations = merge (dict "traefik.ingress.kubernetes.io/router.middlewares" (printf "%s,%s" $existing $middlewareName)) $annotations }}
  {{- else }}
  {{- $annotations = merge (dict "traefik.ingress.kubernetes.io/router.middlewares" $middlewareName) $annotations }}
  {{- end }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- with .pathType }}
            pathType: {{ . }}
            {{- end }}
            backend:
              service:
                name: {{ include "backend.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
